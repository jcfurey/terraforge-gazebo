[develop]
script_dir=$base/lib/terraforge_gazebo
[install]
install_scripts=$base/lib/terraforge_gazebo
[flake8]
# Match ament_flake8's bundled defaults and tell flake8-import-order that
# `terraforge` is this package's own (first-party) import root — without
# this it classifies internal imports as third-party and flags the blank
# line that separates them (I202).
import-order-style = google
application-import-names = terraforge
inline-quotes = single
max-line-length = 99
