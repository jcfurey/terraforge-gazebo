name: ROS 2 CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  colcon:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/terraforge_gazebo

      - name: Install apt dependencies
        run: |
          apt-get update
          # ros:jazzy-ros-base ships without pip; install it before the
          # pip step below (otherwise `python3 -m pip` fails with
          # "No module named pip").
          apt-get install -y python3-pip
          rosdep update
          # No fallback `|| apt-get install ...` here: it only existed to
          # paper over the bogus ament_python buildtool_depend (removed from
          # package.xml), and it hid genuine dependency-resolution failures.
          rosdep install --from-paths src --ignore-src -y

      - name: Install pip-only dependencies
        run: |
          python3 -m pip install --break-system-packages \
              -r src/terraforge_gazebo/requirements.txt

      - name: Build
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.bash
          colcon build --packages-select terraforge_gazebo

      - name: Test (ament linters via colcon)
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.bash
          . install/setup.bash
          colcon test --packages-select terraforge_gazebo --event-handlers console_direct+
          colcon test-result --verbose

      - name: Test (pytest functional suite)
        shell: bash
        # colcon test above only runs the ament_copyright/flake8/pep257
        # linter tests. The functional suite under test/ (coordinates,
        # naming, retry, heightmap sizing, DEM sampler, fuel wrappers,
        # normal map, tile parallelism, building geometry) doesn't
        # register with colcon's test plugin; run it directly so
        # regressions actually fail CI.
        run: |
          . /opt/ros/jazzy/setup.bash
          . install/setup.bash
          cd src/terraforge_gazebo
          python3 -m pytest test/ \
              --ignore=test/test_copyright.py \
              --ignore=test/test_flake8.py \
              --ignore=test/test_pep257.py \
              -v --tb=short
